[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pri-general"
version = "2.0.0"
description = "PRI-General v2 protein-RNA dataset pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "biopython>=1.85",
]

[project.scripts]
pri-general = "pri_general.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
