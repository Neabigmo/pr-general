schema_version: pri-general/source-manifest/v2
snapshot_date: 2026-09-05

# Raw data stays local. This file records provenance and availability only;
# generated row counts belong in a release manifest, not in configuration.
sources:
  - id: npinter_main
    role: interaction_source
    status: available
    local_path: data/cache/sources/npinter_v5/interaction_NPInterv5.zip
    source_url: http://bigdata.ibp.ac.cn/npinter5
    note: Official v5 download. It is a ZIP container with interaction_NPInterv5.txt; sequence resolution is still required for many rows.
  - id: npinter_bindingsite
    role: site_resolved_binding
    status: available
    local_path: data/cache/sources/npinter_v5/npinter_bindingsite_raw.parquet
    source_url: http://bigdata.ibp.ac.cn/npinter5
  - id: npinter_mirna
    role: site_resolved_binding
    status: available
    local_path: data/cache/sources/npinter_v5/mirna_protein_raw.parquet
    source_url: http://bigdata.ibp.ac.cn/npinter5
  - id: rcsb_pdb_candidates
    role: experimental_structure_candidates
    status: available
    local_path: data/cache/sources/rcsb_pdb/pdb_raw.parquet
    source_url: https://www.rcsb.org/
  - id: rcsb_pdb_experimental_structures
    role: experimental_structure
    status: available
    local_path: data/cache/sources/rcsb_pdb/experimental_structures
    source_url: https://www.rcsb.org/
    note: Includes 5,209 raw CIFs and derived pair metadata. Pair/interface QC still requires explicit atom metrics.
  - id: rnainter
    role: physical_association
    status: available
    local_path: data/cache/sources/rnainter
    source_url: https://rnainter.org/
  - id: intact
    role: physical_association
    status: available
    local_path: data/cache/sources/intact
    source_url: https://www.ebi.ac.uk/intact/
  - id: encode_rbns
    role: direct_biochemical
    status: available
    local_path: data/cache/sources/encode_rbns
    source_url: https://www.encodeproject.org/
  - id: rfam_legacy
    role: rna_family_annotation
    status: available
    local_path: data/cache/sources/rfam
    source_url: https://rfam.org/
  - id: uniprot_legacy
    role: protein_annotation
    status: available
    local_path: data/cache/sources/uniprot
    source_url: https://www.uniprot.org/
  - id: rnacentral_legacy
    role: rna_annotation
    status: available
    local_path: data/cache/sources/rnacentral
    source_url: https://www.rnacentral.org/
    note: Legacy subset only; current-release mapping remains a large pending download.
  - id: prdbv3
    role: external_benchmark
    status: available
    local_path: data/cache/sources/prdbv3/nr_288_PRDBv3.0.zip
    source_url: https://github.com/shrikantcombio/PRDBv3_dataset
  - id: rna3db_metadata
    role: rna_structure_annotation
    status: available
    local_path: data/cache/sources/rna3db
    source_url: https://github.com/marcellszi/rna3db/releases/tag/2026-01-05-full-release
    note: JSON/cmscan archives downloaded; the 2.1 GB mmCIF asset is redundant with local experimental structures.
  - id: rnacentral_current_id_mapping
    role: rna_annotation
    status: pending_large_download
    local_path: data/cache/sources/rnacentral/current_release/id_mapping.tsv.gz
    source_url: https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/id_mapping/id_mapping.tsv.gz
    note: About 2.5 GB compressed; requires user confirmation before download.
  - id: rnacentral_current_rfam
    role: rna_family_annotation
    status: pending_large_download
    local_path: data/cache/sources/rnacentral/current_release/rfam_annotations.tsv.gz
    source_url: https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/rfam/rfam_annotations.tsv.gz
    note: About 391 MB compressed; requires user confirmation before download.
  - id: rnapedia
    role: external_benchmark
    status: pending_large_download
    local_path: data/cache/sources/rnapedia
    source_url: https://bioinfo.dcc.ufmg.br/rnapedia3/public/download
    note: Complete package is about 35.5 GB; local PDB structures already cover the core structural need.
  - id: postar3
    role: interaction_source
    status: endpoint_unverified
    local_path: data/cache/sources/postar3
    source_url: http://postar.ncrnalab.org
    note: No stable machine-readable public dump was confirmed during this pass; do not fabricate an import.
  - id: boltz2
    role: external_structure_prediction
    status: external_host_out_of_scope
    local_path: null
    source_url: null
    note: Boltz-2 and MSA preparation are configured on the school host and are intentionally excluded from this rebuild.
